name: Deploy Selenite Legal to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the Discord avatar once per day without rebuilding hourly.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Validate source
        run: npm run lint

      - name: Audit deployable dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build static legal site
        env:
          SITE_URL: https://quantum-sharkware.github.io/selenite-legal/
          NEXT_PUBLIC_BASE_PATH: /selenite-legal
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Verify rendered legal pages
        env:
          SITE_URL: https://quantum-sharkware.github.io/selenite-legal/
          NEXT_PUBLIC_BASE_PATH: /selenite-legal
        run: node --test tests/rendered-html.test.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
